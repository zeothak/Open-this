<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Will You Go Out With Me?</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    min-height:100svh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:linear-gradient(135deg,#ff8fc2,#ffc1dd 45%,#ff9acb);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:12px;
    position:relative;
}

/* Floating background hearts */
.bg-heart{
    position:fixed;
    pointer-events:none;
    opacity:.4;
    animation:floatHeart 5s ease-in-out infinite;
    z-index:0;
}
@keyframes floatHeart{
    0%,100%{transform:translateY(0) rotate(-8deg)}
    50%{transform:translateY(-15px) rotate(8deg)}
}

/* Main card */
.card{
    width:min(94vw,560px);
    height:min(680px,94svh);
    overflow:hidden;
    background:rgba(255,250,253,.96);
    border:2px solid rgba(255,255,255,.85);
    border-radius:30px;
    box-shadow:0 18px 55px rgba(160,35,100,.25);
    padding:24px 16px;
    text-align:center;
    position:relative;
    z-index:2;
}

.small-heart{
    color:#ff3d91;
    font-size:30px;
    margin-bottom:3px;
}

h1{
    color:#d71970;
    font-size:clamp(31px,8.5vw,55px);
    line-height:1.05;
    margin:6px auto 12px;
    font-weight:800;
}

.subtitle{
    color:#ee4c96;
    font-size:16px;
    margin:0 auto 10px;
}

/*
  The button area is deliberately kept inside the card.
  NO can NEVER move outside this box.
*/
.button-area{
    width:100%;
    max-width:480px;
    height:250px;
    margin:0 auto;
    position:relative;
}

/* YES */
#yes{
    position:absolute;
    left:50%;
    top:48px;
    transform:translateX(-62%);
    width:clamp(175px,48vw,230px);
    height:clamp(82px,22vw,105px);
    border:0;
    border-radius:60px;
    background:linear-gradient(#ff66aa,#f51d79);
    color:white;
    font-size:clamp(29px,7vw,36px);
    font-weight:800;
    box-shadow:0 8px 0 #d31367,0 14px 25px rgba(235,25,115,.32);
    z-index:20;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:width .2s ease,height .2s ease,font-size .2s ease;
}

#yes:active{
    transform:translateX(-62%) translateY(4px);
}

/* NO */
#no{
    position:absolute;
    left:calc(50% + 60px);
    top:65px;
    width:clamp(95px,27vw,125px);
    height:clamp(54px,16vw,68px);
    border:0;
    border-radius:45px;
    background:linear-gradient(#fafafa,#d8d8d8);
    color:#444;
    font-size:clamp(19px,5vw,25px);
    font-weight:800;
    box-shadow:0 6px 0 #b7b7b7,0 10px 18px rgba(0,0,0,.12);
    z-index:30;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:left .18s ease,top .18s ease;
}

/* Hint */
.hint{
    margin:4px auto 0;
    max-width:430px;
    padding:12px 15px;
    border-radius:20px;
    background:#ffe3f0;
    border:2px solid #ffc1dd;
    color:#c92172;
    font-size:15px;
}

/* Success */
#success{display:none}

.success-heart{
    font-size:80px;
    margin-top:55px;
    animation:pulse 1s ease-in-out infinite alternate;
}

@keyframes pulse{
    from{transform:scale(1)}
    to{transform:scale(1.12)}
}

#success p{
    color:#c92172;
    font-size:21px;
    font-weight:600;
}

.best-day{
    margin:30px auto 0;
    max-width:400px;
    padding:13px;
    border-radius:20px;
    background:#ffe3f0;
    color:#c92172;
    font-size:15px;
}

/* Falling hearts */
.falling-heart{
    position:fixed;
    top:-50px;
    pointer-events:none;
    z-index:1;
    animation:fall linear forwards;
}
@keyframes fall{
    0%{transform:translateY(-50px) rotate(0deg);opacity:0}
    10%{opacity:.9}
    100%{transform:translateY(110svh) rotate(360deg);opacity:0}
}

.sparkle{
    position:fixed;
    color:white;
    font-size:20px;
    pointer-events:none;
    z-index:1;
    animation:sparkle 1.8s ease-in-out infinite;
}
@keyframes sparkle{
    0%,100%{opacity:.2;transform:scale(.7)}
    50%{opacity:1;transform:scale(1.3)}
}

/* Small iPhones */
@media(max-width:430px){
    body{padding:8px}

    .card{
        width:96vw;
        height:min(650px,96svh);
        padding:20px 10px;
        border-radius:26px;
    }

    h1{
        font-size:clamp(29px,8vw,38px);
        margin-bottom:9px;
    }

    .subtitle{
        font-size:14px;
        margin-bottom:4px;
    }

    .button-area{
        height:235px;
        width:100%;
    }

    #yes{
        top:45px;
        width:185px;
        height:88px;
        font-size:30px;
        transform:translateX(-65%);
    }

    #yes:active{
        transform:translateX(-65%) translateY(4px);
    }

    #no{
        left:calc(50% + 48px);
        top:61px;
        width:102px;
        height:58px;
        font-size:20px;
    }

    .hint{
        font-size:13px;
        padding:10px;
        margin-top:0;
    }
}

/* Very small phones */
@media(max-width:360px){
    .card{
        height:96svh;
        padding:17px 8px;
    }

    h1{font-size:28px}
    .button-area{height:225px}

    #yes{
        width:165px;
        height:80px;
        font-size:27px;
        transform:translateX(-68%);
    }

    #yes:active{
        transform:translateX(-68%) translateY(4px);
    }

    #no{
        left:calc(50% + 42px);
        width:92px;
        height:54px;
        font-size:18px;
    }

    .hint{font-size:12px}
}
</style>
</head>

<body>

<div class="bg-heart" style="left:3%;top:10%;font-size:45px;">♥</div>
<div class="bg-heart" style="right:4%;top:18%;font-size:38px;animation-delay:1s;">♥</div>
<div class="bg-heart" style="left:5%;bottom:12%;font-size:32px;animation-delay:2s;">♥</div>
<div class="bg-heart" style="right:3%;bottom:15%;font-size:48px;animation-delay:3s;">♥</div>

<div class="sparkle" style="left:12%;top:24%;">✦</div>
<div class="sparkle" style="right:12%;top:15%;animation-delay:.5s;">✦</div>

<div class="card">

    <div id="question">
        <div class="small-heart">♡</div>

        <h1>Will you<br>go out with me? 💕</h1>

        <div class="button-area" id="buttonArea">
            <button id="yes" type="button">Yes 💗</button>
            <button id="no" type="button">No 🥺</button>
        </div>

        <div class="hint">
            💗 😉
        </div>
    </div>

    <div id="success">
        <div class="success-heart">💗</div>
        <h1>Yay!!! 🥰</h1>
        <p>I knew you would say yes!</p>

        <div class="best-day">
            💕 Let's have dinner 💕
        </div>
    </div>

</div>

<script>
(function(){

    const yes=document.getElementById("yes");
    const no=document.getElementById("no");
    const area=document.getElementById("buttonArea");
    const question=document.getElementById("question");
    const success=document.getElementById("success");

    let noCount=0;

    function moveNo(){

        const areaRect=area.getBoundingClientRect();
        const noRect=no.getBoundingClientRect();
        const yesRect=yes.getBoundingClientRect();

        const padding=8;

        const maxX=areaRect.width-noRect.width-padding;
        const maxY=areaRect.height-noRect.height-padding;

        let x=padding;
        let y=padding;
        let found=false;

        for(let attempt=0;attempt<50;attempt++){

            x=padding+Math.random()*Math.max(1,maxX-padding);
            y=padding+Math.random()*Math.max(1,maxY-padding);

            const candidate={
                left:areaRect.left+x,
                right:areaRect.left+x+noRect.width,
                top:areaRect.top+y,
                bottom:areaRect.top+y+noRect.height
            };

            const overlap=
                candidate.right>yesRect.left-12 &&
                candidate.left<yesRect.right+12 &&
                candidate.bottom>yesRect.top-12 &&
                candidate.top<yesRect.bottom+12;

            if(!overlap){
                found=true;
                break;
            }
        }

        /*
          x/y are relative to the button-area itself.
          Therefore NO is guaranteed to remain inside the card.
        */
        no.style.left=x+"px";
        no.style.top=y+"px";

        noCount++;

        /*
          YES grows only a little.
          It is capped specifically for small iPhone screens.
        */
        const isSmall=window.innerWidth<=430;

        const maxWidth=isSmall?205:290;
        const maxHeight=isSmall?98:125;
        const maxFont=isSmall?34:42;

        const width=Math.min(isSmall?185:230,noCount*(isSmall?7:10)+(isSmall?185:230),maxWidth);
        const height=Math.min(isSmall?88:105,noCount*(isSmall?3:4)+(isSmall?88:105),maxHeight);
        const font=Math.min(isSmall?30:36,noCount*(isSmall?1:1.5)+(isSmall?30:36),maxFont);

        yes.style.width=width+"px";
        yes.style.height=height+"px";
        yes.style.fontSize=font+"px";

        if(noCount>=3){
            yes.textContent="YES!!! 💖";
        }
    }

    no.addEventListener("click",function(e){
        e.preventDefault();
        moveNo();
    });

    no.addEventListener("mouseenter",function(){
        if(window.innerWidth>600){
            moveNo();
        }
    });

    yes.addEventListener("click",function(){
        question.style.display="none";
        success.style.display="block";

        for(let i=0;i<35;i++){
            setTimeout(createHeart,i*80);
        }
    });

    function createHeart(){
        const heart=document.createElement("div");
        heart.className="falling-heart";

        const symbols=["♥","♡","❤","💗","💖","💕","💘"];
        heart.textContent=symbols[Math.floor(Math.random()*symbols.length)];

        heart.style.left=Math.random()*100+"vw";
        heart.style.fontSize=(18+Math.random()*26)+"px";
        heart.style.animationDuration=(4+Math.random()*5)+"s";

        document.body.appendChild(heart);

        setTimeout(()=>heart.remove(),10000);
    }

    for(let i=0;i<14;i++){
        setTimeout(createHeart,i*160);
    }

    setInterval(createHeart,500);

})();
</script>

</body>
</html>
