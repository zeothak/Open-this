<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Will You Go Out With Me?</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:linear-gradient(135deg,#ffafd2,#ffd8e8);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  touch-action:manipulation;
}

.card{
  width:90vw;
  max-width:520px;
  min-height:390px;
  padding:38px 20px;
  border-radius:28px;
  background:rgba(255,255,255,.94);
  box-shadow:0 18px 50px rgba(180,55,110,.20);
  text-align:center;
  position:relative;
  z-index:10;
}

h1{
  color:#d63384;
  font-size:clamp(30px,8vw,48px);
  margin:10px 0 32px;
  line-height:1.12;
}

.buttons{
  width:100%;
  min-height:190px;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:center;
  gap:18px;
  padding:10px 0;
}

button{
  flex:0 0 auto;
  border:0;
  border-radius:999px;
  min-height:64px;
  padding:14px 24px;
  font-family:Arial,sans-serif;
  font-size:20px;
  font-weight:700;
  -webkit-appearance:none;
  appearance:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  user-select:none;
  cursor:pointer;
  transition:
    width .25s ease,
    height .25s ease,
    font-size .25s ease,
    padding .25s ease;
}

#yes{
  width:180px;
  height:64px;
  background:#ff4f9a;
  color:white;
  box-shadow:0 8px 20px rgba(255,79,154,.30);
}

#no{
  width:140px;
  height:64px;
  background:#eeeeee;
  color:#555;
}

/* After enough NO presses, put YES on its own row.
   The gap is controlled by flex, so it never overlaps or jumps strangely. */
.buttons.big{
  flex-direction:column;
  gap:14px;
}

.buttons.big #yes{
  width:min(88%,360px);
  height:115px;
  font-size:34px;
}

.buttons.big #no{
  width:120px;
  height:58px;
  font-size:17px;
}

.success{
  display:none;
}

.big-heart{
  font-size:78px;
  line-height:1;
  margin:15px 0;
  animation:pulse 1s infinite alternate;
}

.success p{
  color:#b02a6b;
  font-size:21px;
  margin:0;
}

@keyframes pulse{
  to{transform:scale(1.12)}
}

.heart{
  position:fixed;
  top:-45px;
  pointer-events:none;
  z-index:1;
  animation:fall linear forwards;
  opacity:.85;
  user-select:none;
}

@keyframes fall{
  0%{
    transform:translateY(-50px) rotate(0deg);
    opacity:0;
  }
  10%{opacity:.9}
  100%{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<div class="card">

  <div id="question">
    <h1>Will you go out with me? 💕</h1>

    <div id="buttons" class="buttons">
      <button id="yes" type="button">Yes 💖</button>
      <button id="no" type="button">No 😢</button>
    </div>
  </div>

  <div id="success" class="success">
    <div class="big-heart">💗</div>
    <h1>Yay!!! 🥰</h1>
    <p>I knew you would say yes! ❤️</p>
    <p>Let's have dinner ❤️</p>
  </div>

</div>

<script>
(function(){

  var yes = document.getElementById("yes");
  var no = document.getElementById("no");
  var buttons = document.getElementById("buttons");
  var question = document.getElementById("question");
  var success = document.getElementById("success");

  var noCount = 0;

  yes.addEventListener("click", function(){
    question.style.display = "none";
    success.style.display = "block";

    for(var i=0;i<25;i++){
      setTimeout(createHeart, i*90);
    }
  });

  no.addEventListener("click", function(){

    noCount++;

    /*
      Keep the buttons in a FLEX layout.
      This means the gap is always controlled by "gap: 18px"
      instead of manually moving buttons with left/top/transform.
    */

    if(noCount < 5){

      var width = 180 + noCount * 22;
      var height = 64 + noCount * 8;
      var font = 20 + noCount * 2;

      yes.style.width = width + "px";
      yes.style.height = height + "px";
      yes.style.fontSize = font + "px";

      no.style.width = Math.max(115,140 - noCount * 5) + "px";

      if(noCount >= 3){
        yes.textContent = "YES!!! 💖";
      }

    }else{

      // Once YES gets large, move it above NO.
      // The flex gap keeps a clean, predictable spacing.
      buttons.classList.add("big");
      yes.textContent = "YES!!! 💖";
    }
  });

  function createHeart(){

    var heart = document.createElement("div");
    heart.className = "heart";

    var symbols = ["♥","♡","❤","💗","💖","💕"];
    heart.textContent = symbols[Math.floor(Math.random()*symbols.length)];

    heart.style.left = (Math.random()*100) + "vw";
    heart.style.fontSize = (18 + Math.random()*25) + "px";
    heart.style.animationDuration = (4 + Math.random()*5) + "s";

    document.body.appendChild(heart);

    setTimeout(function(){
      if(heart.parentNode){
        heart.parentNode.removeChild(heart);
      }
    },10000);
  }

  // Start falling hearts immediately.
  for(var i=0;i<12;i++){
    setTimeout(createHeart,i*180);
  }

  setInterval(createHeart,450);

})();
</script>

</body>
</html>
