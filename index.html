<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Will You Go Out With Me?</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    overflow: hidden;
}

body {
    min-height: 100svh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.8) 0 5px, transparent 6px),
        radial-gradient(circle at 85% 25%, rgba(255,255,255,.65) 0 4px, transparent 5px),
        linear-gradient(135deg, #ff8fc2, #ffc1dd 45%, #ff9acb);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
    position: relative;
}

/* Background hearts */
.bg-heart {
    position: fixed;
    pointer-events: none;
    opacity: .45;
    animation: floatHeart 5s ease-in-out infinite;
    z-index: 0;
}

@keyframes floatHeart {
    0%,100% { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-18px) rotate(8deg); }
}

/* Main card */
.card {
    width: min(92vw, 560px);
    min-height: 560px;
    max-height: 92svh;
    overflow: hidden;
    background: rgba(255,250,253,.96);
    border: 2px solid rgba(255,255,255,.85);
    border-radius: 32px;
    box-shadow: 0 20px 60px rgba(160, 35, 100, .25);
    padding: 30px 22px;
    text-align: center;
    position: relative;
    z-index: 2;
}

.question {
    min-height: 100%;
}

.small-heart {
    color: #ff3d91;
    font-size: 32px;
    margin-bottom: 8px;
}

h1 {
    color: #d71970;
    font-size: clamp(34px, 9vw, 58px);
    line-height: 1.05;
    margin: 8px auto 18px;
    font-weight: 800;
}

.subtitle {
    color: #ee4c96;
    font-size: 18px;
    margin-bottom: 25px;
}

/* Button area */
.button-area {
    height: 245px;
    position: relative;
    margin-top: 10px;
}

/* YES */
#yes {
    position: absolute;
    left: 50%;
    top: 35px;
    transform: translateX(-58%);
    width: 230px;
    height: 105px;
    border: 0;
    border-radius: 60px;
    background: linear-gradient(#ff66aa, #f51d79);
    color: white;
    font-size: 36px;
    font-weight: 800;
    box-shadow:
        0 9px 0 #d31367,
        0 15px 28px rgba(235, 25, 115, .35);
    z-index: 20;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

#yes:active {
    transform: translateX(-58%) translateY(5px);
    box-shadow: 0 4px 0 #d31367, 0 8px 18px rgba(235,25,115,.3);
}

/* NO */
#no {
    position: absolute;
    left: calc(50% + 105px);
    top: 60px;
    width: 125px;
    height: 68px;
    border: 0;
    border-radius: 45px;
    background: linear-gradient(#fafafa, #d8d8d8);
    color: #444;
    font-size: 25px;
    font-weight: 800;
    box-shadow: 0 7px 0 #b7b7b7, 0 12px 20px rgba(0,0,0,.12);
    z-index: 30;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: left .18s ease, top .18s ease, transform .18s ease;
}

/* Hint */
.hint {
    margin: 15px auto 0;
    max-width: 430px;
    padding: 14px 18px;
    border-radius: 22px;
    background: #ffe3f0;
    border: 2px solid #ffc1dd;
    color: #c92172;
    font-size: 16px;
}

/* Success */
#success {
    display: none;
}

.success-heart {
    font-size: 90px;
    margin-top: 30px;
    animation: pulse 1s ease-in-out infinite alternate;
}

@keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.12); }
}

#success h1 {
    margin-top: 10px;
}

#success p {
    color: #c92172;
    font-size: 22px;
    font-weight: 600;
}

.best-day {
    margin-top: 35px;
    padding: 14px;
    border-radius: 22px;
    background: #ffe3f0;
    color: #c92172;
    font-size: 16px;
}

/* Falling hearts */
.falling-heart {
    position: fixed;
    top: -50px;
    pointer-events: none;
    z-index: 1;
    animation: fall linear forwards;
}

@keyframes fall {
    0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0;
    }
    10% {
        opacity: .9;
    }
    100% {
        transform: translateY(110svh) rotate(360deg);
        opacity: 0;
    }
}

/* Sparkles */
.sparkle {
    position: fixed;
    color: white;
    font-size: 20px;
    pointer-events: none;
    z-index: 1;
    animation: sparkle 1.8s ease-in-out infinite;
}

@keyframes sparkle {
    0%,100% { opacity: .2; transform: scale(.7); }
    50% { opacity: 1; transform: scale(1.3); }
}

@media (max-width: 430px) {
    .card {
        min-height: 540px;
        padding: 25px 15px;
    }

    .button-area {
        height: 230px;
    }

    #yes {
        width: 205px;
        height: 94px;
        font-size: 32px;
        transform: translateX(-60%);
    }

    #yes:active {
        transform: translateX(-60%) translateY(5px);
    }

    #no {
        width: 105px;
        height: 60px;
        font-size: 21px;
        left: calc(50% + 82px);
    }
}
</style>
</head>

<body>

<!-- Decorative background -->
<div class="bg-heart" style="left:5%;top:10%;font-size:55px;">♥</div>
<div class="bg-heart" style="right:7%;top:18%;font-size:45px;animation-delay:1s;">♥</div>
<div class="bg-heart" style="left:8%;bottom:12%;font-size:38px;animation-delay:2s;">♥</div>
<div class="bg-heart" style="right:5%;bottom:15%;font-size:60px;animation-delay:3s;">♥</div>

<div class="sparkle" style="left:14%;top:25%;">✦</div>
<div class="sparkle" style="right:16%;top:12%;animation-delay:.5s;">✦</div>
<div class="sparkle" style="left:20%;bottom:18%;animation-delay:1s;">✦</div>

<div class="card">

    <div id="question">
        <div class="small-heart">♡</div>

        <h1>Will you<br>go out with me?</h1>

        <div class="subtitle">I have a very important question for you... 💕</div>

        <div class="button-area" id="buttonArea">
            <button id="yes" type="button">Yes 💗</button>
            <button id="no" type="button">No 🥺</button>
        </div>

        <div class="hint">
            💗 Pssst... try pressing “No”<br>
            if you think you can catch it! 😉
        </div>
    </div>

    <div id="success">
        <div class="success-heart">💗</div>
        <h1>Yay!!! 🥰</h1>
        <p>I knew you would say yes!</p>

        <div class="best-day">
            💕 Let's have dinner 💕
        </div>
    </div>

</div>

<script>
(function () {
    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const area = document.getElementById("buttonArea");
    const question = document.getElementById("question");
    const success = document.getElementById("success");

    let noCount = 0;

    function moveNo() {
        const areaRect = area.getBoundingClientRect();
        const noRect = no.getBoundingClientRect();

        const padding = 8;

        // Keep the NO button completely inside the button area.
        const maxX = Math.max(padding, areaRect.width - noRect.width - padding);
        const maxY = Math.max(padding, areaRect.height - noRect.height - padding);

        // Avoid putting NO directly over YES.
        let x, y;
        let tries = 0;

        do {
            x = padding + Math.random() * Math.max(1, maxX - padding);
            y = padding + Math.random() * Math.max(1, maxY - padding);
            tries++;

            const yesRect = yes.getBoundingClientRect();

            const candidate = {
                left: areaRect.left + x,
                right: areaRect.left + x + noRect.width,
                top: areaRect.top + y,
                bottom: areaRect.top + y + noRect.height
            };

            const overlaps =
                candidate.right > yesRect.left - 12 &&
                candidate.left < yesRect.right + 12 &&
                candidate.bottom > yesRect.top - 12 &&
                candidate.top < yesRect.bottom + 12;

            if (!overlaps) break;

        } while (tries < 30);

        no.style.left = x + "px";
        no.style.top = y + "px";

        // Make YES bigger each time.
        noCount++;

        const yesWidth = Math.min(230 + noCount * 12, 330);
        const yesHeight = Math.min(105 + noCount * 6, 145);
        const yesFont = Math.min(36 + noCount * 2, 44);

        yes.style.width = yesWidth + "px";
        yes.style.height = yesHeight + "px";
        yes.style.fontSize = yesFont + "px";

        if (noCount >= 3) {
            yes.textContent = "YES!!! 💖";
        }
    }

    // Click/tap support for iPhone.
    no.addEventListener("click", function (event) {
        event.preventDefault();
        moveNo();
    });

    // On desktop, also escape when the mouse gets close.
    no.addEventListener("mouseenter", function () {
        if (window.innerWidth > 600) {
            moveNo();
        }
    });

    yes.addEventListener("click", function () {
        question.style.display = "none";
        success.style.display = "block";

        // Celebration burst
        for (let i = 0; i < 35; i++) {
            setTimeout(createHeart, i * 80);
        }
    });

    function createHeart() {
        const heart = document.createElement("div");
        heart.className = "falling-heart";

        const symbols = ["♥", "♡", "❤", "💗", "💖", "💕", "💘"];
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (18 + Math.random() * 28) + "px";
        heart.style.animationDuration = (4 + Math.random() * 5) + "s";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 10000);
    }

    // Start hearts immediately.
    for (let i = 0; i < 14; i++) {
        setTimeout(createHeart, i * 160);
    }

    setInterval(createHeart, 500);
})();
</script>

</body>
</html>
